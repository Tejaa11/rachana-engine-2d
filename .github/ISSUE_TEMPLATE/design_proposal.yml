name: Design proposal
description: Discuss a capability, module, or architectural decision.
title: "[Design]: "
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What should a creator or contributor be able to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach and alternatives
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: How will we demonstrate this works? Include risks, provider costs, dependencies, and the relevant roadmap milestone.
    validations:
      required: true
