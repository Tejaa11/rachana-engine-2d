name: Repository checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Runtime / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check repository foundation
        run: npm run check
      - name: Install locked dependencies
        run: npm ci
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Run schema, evaluator, drawing, audio, IO, and export tests
        run: npm test
      - name: Diagnose and render the smoke example
        run: |
          npm run doctor
          npm run render:smoke
          npm run verify:smoke
      - name: Validate and decode the narrated example
        run: |
          npm run cli -- validate examples/narrated-story/scene.json
          npm run render:demo
          node tools/verify-smoke.mjs renders/rachana-demo.mp4
      - name: Validate and render the creative character showcase
        run: |
          npm run cli -- validate examples/narrated-story/creative.scene.json
          npm run render:creative
          node tools/verify-smoke.mjs renders/rachana-creative.mp4
